<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoIbititá — Nova Denúncia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

    <!-- Cabeçalho -->
    <header class="header">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="24" cy="24" r="21"></circle>
                    <path d="M14 31c7-1 13-5 18-14-8 0-15 3-18 9-1 2-1 4 0 5Z"></path>
                    <path d="M15 34c5-7 10-12 17-17"></path>
                    <path d="M12 15c4 2 7 5 8 9"></path>
                </svg>
            </div>
            <div>
                <h1>EcoIbititá</h1>
                <span>Prefeitura Municipal de Ibititá</span>
            </div>
        </div>

        <button class="help" type="button" aria-label="Ajuda">?</button>
    </header>

    <!-- Conteúdo -->
    <section class="content">

        <!-- Foto -->
        <label class="photo-box" for="photo">
            <svg class="camera-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M14 15h6l3-4h6l3 4h2a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H14a5 5 0 0 1-5-5V20a5 5 0 0 1 5-5Z"></path>
                <circle cx="24" cy="27" r="6"></circle>
            </svg>
            <strong>Toque para fotografar</strong>
            <input id="photo" type="file" accept="image/*" capture="environment">
        </label>

        <!-- Localização -->
        <button class="location" type="button">
        <span class="location-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s7-6.1 7-12A7 7 0 1 0 5 9c0 5.9 7 12 7 12Z"></path>
            <circle cx="12" cy="9" r="2.5"></circle>
          </svg>
        </span>
            <span>ADICIONAR LOCALIZAÇÃO</span>
        </button>

        <!-- Categorias -->
        <div class="question">
            <h2>O que foi descartado?</h2>

            <div class="categories">
                <button class="category" type="button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M8 36 17 18l7 9 7-15 9 24H8Z"></path>
                        <path d="m29 19 5-5 5 5"></path>
                    </svg>
                    <span>Entulho</span>
                </button>

                <button class="category" type="button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <rect x="8" y="18" width="32" height="13" rx="2"></rect>
                        <path d="M12 31v8M36 31v8M13 18v-5h5v5M30 18v-5h5v5"></path>
                    </svg>
                    <span>Móveis</span>
                </button>

                <button class="category" type="button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M38 8C21 9 12 17 12 29c0 6 4 10 10 10 10 0 15-12 16-31Z"></path>
                        <path d="M10 39c6-10 13-15 23-18"></path>
                    </svg>
                    <span>Orgânico</span>
                </button>

                <button class="category" type="button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M24 23v17M18 40h12M12 18l24 12M36 18 12 30M24 23c-5-1-8-4-8-8 0-2 2-4 4-4 3 0 4 4 4 12ZM24 23c5-1 8-4 8-8 0-2-2-4-4-4-3 0-4 4-4 12Z"></path>
                    </svg>
                    <span>Mosquito</span>
                </button>
            </div>
        </div>

        <!-- Detalhes -->
        <textarea
                class="details"
                placeholder="Adicione detalhes se quiser (opcional)"
                aria-label="Detalhes da denúncia"></textarea>

        <!-- Histórico -->
        <a class="history" href="#">Ver histórico de denúncias</a>

        <!-- Enviar -->
        <button class="submit" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 20 16-8L4 4l2 8-2 8Z"></path>
                <path d="M6 12h9"></path>
            </svg>
            Enviar Denúncia
        </button>

    </section>
</main>

</body>
</html>
